name: Autonomous Review & Merge

on:
  workflow_run:
    workflows: ["Test Suite"]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, labeled]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: >-
    autonomous-merge-${{ github.event.pull_request.number ||
    github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: validate-and-enable
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'pull_request_target'

    steps:
      - name: Resolve open pull request
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            PR_NUMBER="$EVENT_PR"
          else
            PR_NUMBER=$(gh api "repos/$GH_REPO/commits/$EVENT_SHA/pulls" \
              --jq '[.[] | select(.state == "open" and .base.ref == "main")][0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request targets main for this event."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate exact-head gates
        id: gates
        if: steps.resolve.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          HEAD_SHA=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          HEAD_REPO=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          BASE_REF=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.base.ref')
          IS_DRAFT=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.draft')

          if [ "$HEAD_REPO" != "$GH_REPO" ] || [ "$BASE_REF" != "main" ]; then
            echo "PR is not a same-repository change targeting main."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.labels[].name' \
            | grep -Fxq 'agent-ready'; then
            echo "PR does not have the agent-ready label."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR remains draft; independent review must mark it ready."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUCCESS_COUNT=$(gh api \
            "repos/$GH_REPO/actions/workflows/test.yml/runs?event=pull_request&head_sha=$HEAD_SHA&status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success") ] | length')
          if [ "$SUCCESS_COUNT" -lt 1 ]; then
            echo "No successful Test Suite run exists for exact head $HEAD_SHA."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Exact-head Test Suite passed; branch protections remain authoritative."
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable protected native auto-merge
        if: steps.gates.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --auto
