name: Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONUTF8: 1
        run: python -m pytest -q

      - name: Report results
        if: always()
        run: echo "Test run completed. Check logs above for details."
